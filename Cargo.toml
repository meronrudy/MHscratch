[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/hypergraph",
    "crates/manifold",
    "crates/bridge",
    "crates/exec",
    "crates/analysis",
    "crates/verify",
    "crates/mhg-testkit",
    "crates/toy-core",
    "crates/toy-cli",
    "crates/toy-api",
    "tests",
]

[workspace.dependencies]

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0
